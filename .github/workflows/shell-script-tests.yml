name: Shell Script Tests

# Distinct from build-and-test.yml on purpose: that workflow is
# workflow_dispatch-only by deliberate choice (PRs get no auto-CI there,
# because it needs Xcode + a simulator + the private Wallpaper submodule
# deploy key and costs 20-30 minutes). These suites are different in kind —
# hand-rolled zsh regression tests for the CI scripts themselves
# (.github/scripts/affected-tests.sh, scripts/test-affected.sh,
# scripts/hooks/pre-push, scripts/upload-debug-symbols.sh,
# scripts/upload-dsyms-posthog.sh, scripts/verify-posthog-floor.sh). They need no
# simulator, no submodule, and no secrets — the dSYM suite stubs the
# sentry-cli binary, so nothing here touches the network or needs a real auth
# token; the whole set runs in under two seconds. That asymmetry — cheap
# and self-contained vs. expensive and credential-gated — is the reason this
# workflow auto-runs on pull_request while build-and-test.yml stays manual.
#
# Path-filtered to the directories these scripts (and their tests) actually
# live in, so an unrelated PR (docs, Swift-only) doesn't spend a macOS
# runner-minute on a check that could not have caught anything. The triggers are
# .github/scripts/**, scripts/**, ci_scripts/**, Shared/Analytics/Package.swift,
# this file, and WXYC.xcodeproj/project.pbxproj. A macOS job is billed at a 10x
# multiplier and rounded up to a whole minute, so "runs in two seconds" still
# costs ~10 billable minutes per run on this private repo.
#
# project.pbxproj is in the filter only so a change to its posthog-ios
# requirement is seen (#1248), and it is edited by ~12% of master commits. A path
# filter cannot look inside a file, so the cheap ubuntu `gate` job runs
# scripts/shell-script-tests-gate.sh and the macOS job runs only when a gated
# path other than the pbxproj changed or the posthog-ios entry in it differs
# (#1250). A pbxproj edit that leaves the requirement alone costs one ubuntu
# job, not ten billed macOS minutes.
#
# This workflow's own path is in the filter on purpose: a self-excluding
# workflow can be broken by an edit that never triggers it, which is the
# exact failure class this file exists to prevent.

# Keep the non-pbxproj paths below in sync with the regex in
# scripts/shell-script-tests-gate.sh; scripts/tests/test-shell-script-tests-gate.sh
# fails when a path here is not matched there.
on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - "scripts/**"
      - "ci_scripts/**"
      - "Shared/Analytics/Package.swift"
      - "WXYC.xcodeproj/project.pbxproj"
      - ".github/workflows/shell-script-tests.yml"
  push:
    branches:
      - master
    paths:
      - ".github/scripts/**"
      - "scripts/**"
      - "ci_scripts/**"
      - "Shared/Analytics/Package.swift"
      - "WXYC.xcodeproj/project.pbxproj"
      - ".github/workflows/shell-script-tests.yml"
  workflow_dispatch:

concurrency:
  group: shell-script-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        run: |
          case "${{ github.event_name }}" in
            pull_request) base="${{ github.event.pull_request.base.sha }}" ;;
            push) base="${{ github.event.before }}" ;;
            *) echo "run=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # Separate statement so `set -e` sees a gate-script failure; inside
          # echo "$(...)" it would be swallowed and the macOS job skipped.
          run=$(scripts/shell-script-tests-gate.sh "$base" HEAD)
          echo "run=$run" >> "$GITHUB_OUTPUT"

  shell-script-tests:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # macOS, not ubuntu. Three reasons, in increasing order of how much work
    # it would take to lift them:
    #   1. test-affected-tests.sh edits its pbxproj fixtures with BSD sed
    #      (`sed -i ''`). GNU sed takes its backup suffix appended to the
    #      option, never as a separate argument, so it would read `''` as the
    #      script and `s/.../.../` as a filename and fail.
    #   2. Every script here and every script under test is `#!/bin/zsh` and
    #      leans on zsh-only syntax (`${0:A:h}`, `${(k)…}`, `${=VAR}`,
    #      `typeset -A`). Ubuntu runners would need zsh installed first.
    #   3. affected-tests.sh's pbxproj fingerprint runs through awk + sort,
    #      whose BSD and GNU behaviors diverge; the thing under test ships to
    #      macOS runners, so testing it on a macOS userland is the honest
    #      configuration.
    # Lifting 1 and 2 is plausible if the 10x macOS billing multiplier ever
    # becomes the deciding factor; 3 argues against it regardless.
    runs-on: macos-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: affected-tests.sh regression suite
        run: zsh .github/scripts/tests/test-affected-tests.sh

      - name: pre-push hook regression suite
        run: zsh scripts/tests/test-pre-push-hook.sh

      - name: test-affected.sh error-fallback regression suite
        run: zsh scripts/tests/test-affected-error-fallback.sh

      - name: Sentry dSYM upload regression suite
        run: zsh scripts/tests/test-upload-debug-symbols.sh

      - name: PostHog dSYM upload regression suite
        run: zsh scripts/tests/test-upload-dsyms-posthog.sh

      - name: Simulator-resolution regression suite
        run: zsh scripts/tests/test-simulator-resolution.sh

      # Covers the contract-version.json <-> api.yaml version assertion in
      # scripts/regenerate-api-types.sh (#923). Belongs here rather than in
      # verify-api-types.yml: that workflow proves the vendored tree matches
      # the real pinned contract, which means cloning wxyc-shared and running
      # the JVM codegen. This suite proves the assertion itself behaves, off a
      # local stand-in repo with npm/java stubbed, in about a second.
      - name: contract-version.json assertion regression suite
        run: zsh scripts/tests/test-api-types-contract-version.sh

      - name: macOS-job gate regression suite
        run: zsh scripts/tests/test-shell-script-tests-gate.sh

      # posthog-ios is required in Package.swift and in the Xcode project
      # (#1248); the second step fails when the two floors differ.
      - name: posthog-ios floor check regression suite
        run: zsh scripts/tests/test-verify-posthog-floor.sh

      - name: posthog-ios floor agrees between Package.swift and the project
        run: zsh scripts/verify-posthog-floor.sh
