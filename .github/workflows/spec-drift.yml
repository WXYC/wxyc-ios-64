name: API Spec Drift

# Staleness check for the wxyc-shared pin, not for the vendored tree.
#
# verify-api-types.yml already proves "the vendored Shared/WXYCAPIModels tree
# matches a fresh regen from the SHA pinned in
# Shared/WXYCAPIModels/contract-version.json" -- it fails if someone edits the
# pin or the generated types without regenerating. It is structurally blind to
# a different question: has wxyc-shared's api.yaml moved on since that SHA was
# pinned? A pin can be perfectly self-consistent with the vendored tree and
# still be 16 commits behind upstream, which is exactly today's state (#984) --
# nothing short of a human diffing two repos would have caught that drift.
#
# This workflow answers that second question by calling wxyc-shared's
# reusable, read-only check-api-spec-drift.yml on a weekly schedule (plus
# workflow_dispatch for on-demand checks). It never touches the pin itself --
# advancing contract-version.json, and absorbing whatever Swift type renames
# that forces (this repo's generated types are operation-derived, so a
# wxyc-shared path relocation like the ones in the 16-commit span behind this
# pin renames Swift symbols, not just fields), is separate work with its own
# risk profile. See #984's "What advancing the pin will cost" section before
# picking that up.
#
# A red scheduled run nobody watches is not a signal, so both outcomes that
# need a human -- drift, and a check that never reached a verdict -- open a
# tracking issue. Each outcome has its own title and its own open-issue
# lookup, so neither suppresses the other; closing an issue is what lets the
# next affected run open a fresh one.
#
# Siblings with the same shape: WXYC/request-o-matic's codegen-drift.yml and
# WXYC/library-metadata-lookup's codegen-drift.yml. Keep the three in step --
# they are one mechanism aimed at one contract.
#
# EXPECTED FIRST RUN: as of this workflow's introduction, the pin (c804de3,
# api.yaml 1.36.0) is 16 commits behind wxyc-shared:main (api.yaml 1.46.0). A
# scheduled run that reports "no drift" today would mean the wiring here is
# broken, not that the pin caught up -- nobody has advanced it. Drift should
# clear only after a future PR bumps wxycSharedSha.

on:
  schedule:
    - cron: "0 13 * * 1" # weekly, Monday 13:00 UTC
  workflow_dispatch:

# Workflow-level floor: read-only. read-pin and check-drift never write
# anything -- check-drift's own workflow_call file pins itself to
# `contents: read` too, and per wxyc-shared's Tag Stability Policy,
# reusable-workflow permissions intersect (caller AND callee) at job dispatch,
# so raising the ceiling here would do nothing for that job anyway. Only
# report-drift needs to write, and it grants itself issues:write scoped to
# just that job, per #984's constraint that the drift check stays read-only.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  read-pin:
    name: Read pinned wxyc-shared SHA
    runs-on: ubuntu-latest
    outputs:
      pinned-sha: ${{ steps.pin.outputs.pinned-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # wxycSharedSha is the real pin. wxycSharedTag currently reads the
      # literal string "main" -- a leftover that does NOT track what is
      # actually pinned (see #984) -- so this deliberately never reads that
      # field. Read the SHA, not the tag.
      #
      # The SHA is read here, at run time, and handed to check-drift as a job
      # output rather than hard-coded anywhere in this file: a SHA baked into
      # the workflow YAML would be a second copy to keep in sync with
      # contract-version.json, and the two would drift from each other the
      # same way the pin drifts from upstream.
      - name: Read wxycSharedSha from contract-version.json
        id: pin
        run: |
          set -euo pipefail
          PIN_FILE="Shared/WXYCAPIModels/contract-version.json"
          SHA="$(jq -r '.wxycSharedSha' "$PIN_FILE")"
          if [[ -z "$SHA" || "$SHA" == "null" ]]; then
            echo "::error::could not read .wxycSharedSha from $PIN_FILE"
            exit 1
          fi
          echo "pinned-sha=$SHA" >> "$GITHUB_OUTPUT"

  check-drift:
    name: Check pin against wxyc-shared:main
    needs: read-pin
    uses: WXYC/wxyc-shared/.github/workflows/check-api-spec-drift.yml@gha/v1
    with:
      pinned-ref: ${{ needs.read-pin.outputs.pinned-sha }}
      # Pinning `@gha/v1` on `uses:` above only pins the workflow YAML; the
      # script it runs (check-spec-drift.sh) comes from whatever
      # wxyc-shared-ref resolves to, which defaults to `main`. Set it to
      # `gha/v1` explicitly so "pinned to gha/v1" is a true statement about
      # what ran, not just about which YAML got dispatched -- see
      # wxyc-shared's Tag Stability Policy and the mixed-state warning it
      # documents for consumers that leave this input unset.
      wxyc-shared-ref: gha/v1

  report-drift:
    name: Open tracking issue
    needs: [read-pin, check-drift]
    # Two outcomes need a human: drift, and a check that never reached a
    # verdict (raw.githubusercontent hiccup, a `gha/v1` retag, a failed
    # `git ls-remote`, an unreadable pin file -- which skips check-drift).
    # Gating on the drift output alone skips this job in the second case and
    # leaves nothing but a red scheduled run -- the unwatched signal this
    # workflow exists to replace. `!cancelled()` keeps a deliberately
    # cancelled run from filing anything.
    if: >-
      !cancelled()
      && (needs.check-drift.result != 'success' || needs.check-drift.outputs.drift == 'true')
    runs-on: ubuntu-latest
    # check-api-spec-drift.yml is workflow-level `contents: read` and cannot
    # be escalated by a caller (permissions intersect, they don't union) -- so
    # issue-filing has to be its own job with its own grant. This is the only
    # job in this file that writes anything.
    permissions:
      issues: write
    env:
      # One literal per outcome, read by both the lookup and the create below,
      # so a title edit cannot desync the two and start opening a duplicate
      # every week.
      DRIFT_ISSUE_TITLE: "wxyc-shared api.yaml pin in contract-version.json is stale"
      CHECK_FAILED_ISSUE_TITLE: "Scheduled spec drift check could not run"
    steps:
      # Every `${{ }}` expression this script needs is routed through `env:`
      # and read as a shell variable rather than inlined. Actions substitutes
      # `${{ }}` textually before the shell parses the script, so an inline
      # expression is a script-injection vector. Nothing here is
      # attacker-controlled today; the habit costs nothing and matches
      # wxyc-shared's check-api-spec-drift.yml.
      - name: File the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_RESULT: ${{ needs.check-drift.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PINNED_SHA: ${{ needs.read-pin.outputs.pinned-sha }}
          PINNED_VERSION: ${{ needs.check-drift.outputs.pinned-version }}
          CURRENT_SHA: ${{ needs.check-drift.outputs.current-sha }}
          CURRENT_VERSION: ${{ needs.check-drift.outputs.current-version }}
        run: |
          set -euo pipefail

          if [ "$CHECK_RESULT" = "success" ]; then
            title="$DRIFT_ISSUE_TITLE"
            body="$(cat <<EOF
          The scheduled [API Spec Drift]($RUN_URL) check found that the \`api.yaml\` pin in \`Shared/WXYCAPIModels/contract-version.json\` has fallen behind \`WXYC/wxyc-shared\`'s \`main\` branch.

          - **Pinned SHA:** \`$PINNED_SHA\` (api.yaml $PINNED_VERSION)
          - **wxyc-shared:main SHA:** \`$CURRENT_SHA\` (api.yaml $CURRENT_VERSION)

          \`verify-api-types.yml\` only proves the vendored tree matches this pin -- it cannot see that the pin itself is stale, which is why this check exists separately.

          Advancing the pin is separate work from filing this issue: this repo's generated Swift types are operation-derived, so an api.yaml path relocation (several land in the span behind this pin) renames Swift symbols, not just fields. See WXYC/wxyc-ios-64#984 for the accounting of what is in the gap.
          EOF
          )"
          else
            title="$CHECK_FAILED_ISSUE_TITLE"
            body="$(cat <<EOF
          The scheduled [API Spec Drift]($RUN_URL) check never reached a verdict -- it failed before it could compare the pin in \`Shared/WXYCAPIModels/contract-version.json\` against \`WXYC/wxyc-shared\`'s \`main\`.

          Drift here is UNKNOWN, not absent. Read the run log for the failing step; the usual causes are a raw.githubusercontent.com hiccup, a failed \`git ls-remote\` against wxyc-shared, an unreadable pin file, or a \`gha/v1\` retag that changed the reusable workflow's contract.

          If it was transient, re-run the workflow and close this issue. If the check itself is broken, fix it -- while it stays broken, nothing reports that the pin has gone stale.
          EOF
          )"
          fi

          # One open issue per title. The label lookup is the primary one: it
          # is deterministic and does not depend on the search index. The
          # title search is the fallback for a tracking issue whose label was
          # removed by hand. Both filter on an EXACT title match -- matching
          # on the label alone would let ANY open issue carrying it (a human
          # triaging, a mislabel, an adjacent ticket) suppress every later
          # report indefinitely, behind a green run.
          find_open_issue() {
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title \
              "$@" \
              | jq -r --arg title "$title" 'map(select(.title == $title)) | .[0].number // empty'
          }

          existing="$(find_open_issue --label codegen-drift)"
          if [ -z "$existing" ]; then
            existing="$(find_open_issue --search "\"$title\" in:title")"
          fi

          # Comment rather than skip when the issue already exists: unlike the
          # Python siblings' static bodies, this one carries the live
          # wxyc-shared:main SHA and version, which move every week the pin
          # stays behind. A previously-CLOSED tracking issue is deliberately
          # not reopened -- a fresh issue for a fresh drift episode reads
          # better than reopening old, possibly stale discussion.
          if [ -n "$existing" ]; then
            gh issue comment "$existing" \
              --repo "$GITHUB_REPOSITORY" \
              --body "$body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --label codegen-drift \
              --body "$body"
          fi
